<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>HG Intel — coming 2027</title>
<meta name="theme-color" content="#00B4FF" />
<link rel="icon" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root{ --ink:#0f172a; --bright:#00B4FF; --accent-text:#0499D9; --soft:#64748b; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#ffffff; color:var(--ink); font-family:'Inter',sans-serif; text-align:center; padding:2rem; }
  main{ display:flex; flex-direction:column; align-items:center; gap:1.4rem; }
  img.mark{ width:140px; height:140px; }
  h1{ font-family:'Cormorant Garamond',serif; font-weight:500; font-size:clamp(2.2rem,6vw,3.2rem); letter-spacing:0.01em; }
  .tag{ font-size:1.05rem; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent-text); }
  .by{ font-size:0.85rem; color:var(--soft); }
  a{ color:var(--accent-text); text-decoration:none; border-bottom:1px solid rgba(4,153,217,0.35); padding-bottom:1px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="hg-mark.svg" alt="" aria-hidden="true" />
  <div class="tag">Coming 2027</div>
  <h1>HG Intel</h1>
  <p class="by">A <a href="https://hg-au.com/">Holistic Governance</a> product.</p>
  <p class="by">Enquiries: <a href="mailto:info@hg-au.com?subject=HG%20Intel">info@hg-au.com</a></p>
